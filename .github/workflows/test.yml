name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: test
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:

    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Get dependencies
      run: |
        go get -v -t -d ./...

    - name: Vet
      run: go vet ./...

    - name: Test MySQL
      env:
        SHIFT_TEST_DIALECT: mysql
        SHIFT_TEST_DB: "root@tcp(localhost:${{ job.services.mysql.ports['3306'] }})/test?"
      run: go test ./...

    - name: Test PostgreSQL
      env:
        SHIFT_TEST_DIALECT: postgres
        SHIFT_TEST_DB: "postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/test?sslmode=disable"
      run: go test ./...
